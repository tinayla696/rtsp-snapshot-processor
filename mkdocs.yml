site_name: rtsp-snapshot-processor
site_description: RTP/RTSPストリームを受信し、周期スナップショットとSQLite記録を行うアプリケーション
site_url: https://tinayla696.github.io/rtsp-snapshot-processor/
repo_name: tinayla696/rtsp-snapshot-processor
repo_url: https://github.com/tinayla696/rtsp-snapshot-processor

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand       # 最初からセクションを展開しておきたい場合に便利
    - navigation.top
    - navigation.indexes      # セクション親要素をインデックス化
    - navigation.tracking     # スクロールに合わせてURLを更新
    - search.highlight
    - search.share
    - search.suggest          # 検索候補を表示
    - content.code.copy
    - content.code.annotate   # コード内の注釈機能
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: ダークモードへ切り替え
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: ライトモードへ切り替え

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - External API: api-spec.md
  - AI Guidelines: ai_guidelines.md
  - Usage: usage.md
  - Testing: testing.md